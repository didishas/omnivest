<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2a2010"/>
      <stop offset="100%" style="stop-color:#0a0b0d"/>
    </linearGradient>
    <linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0d080"/>
      <stop offset="60%" style="stop-color:#c9a84c"/>
      <stop offset="100%" style="stop-color:#a07828"/>
    </linearGradient>
    <linearGradient id="g4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.08"/>
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0"/>
    </linearGradient>
    <linearGradient id="g5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00e5a0"/>
      <stop offset="100%" style="stop-color:#00b87a"/>
    </linearGradient>
  </defs>

  <!-- Background superellipse -->
  <rect width="512" height="512" rx="115" fill="url(#g1)"/>

  <!-- Glass sheen top -->
  <rect width="512" height="256" rx="115" fill="url(#g4)"/>

  <!-- Gold arc ring -->
  <circle cx="256" cy="256" r="148" fill="none" stroke="url(#g2)" stroke-width="16" stroke-linecap="round"/>

  <!-- Subtle inner ring -->
  <circle cx="256" cy="256" r="122" fill="none" stroke="#c9a84c" stroke-width="2" opacity="0.2"/>

  <!-- Chart bars — centered, rounded capsules -->
  <rect x="174" y="230" width="30" height="62" rx="15" fill="url(#g5)" opacity="0.85"/>
  <rect x="216" y="204" width="30" height="88" rx="15" fill="url(#g2)"/>
  <rect x="241" y="182" width="30" height="110" rx="15" fill="url(#g2)"/>
  <rect x="266" y="204" width="30" height="88" rx="15" fill="url(#g2)"/>
  <rect x="308" y="230" width="30" height="62" rx="15" fill="url(#g5)" opacity="0.85"/>

  <!-- Live dot top right -->
  <circle cx="368" cy="148" r="26" fill="url(#g5)"/>
  <circle cx="368" cy="148" r="16" fill="#ffffff" opacity="0.25"/>

  <!-- Border glow -->
  <rect width="512" height="512" rx="115" fill="none" stroke="#c9a84c" stroke-width="3" opacity="0.2"/>
</svg>
